name: Forge 2.0 Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  forge2-verification:
    name: forge2-verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # The verifier proves the exact commit parent.
          # Two commits are the minimum required history.
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: |
          python - <<'PY'
          from pathlib import Path

          count = 0

          for root in (
              Path("src"),
              Path("tests"),
              Path("scripts"),
              Path(".githooks"),
          ):
              for path in sorted(
                  root.rglob("*.py")
              ):
                  compile(
                      path.read_text(
                          encoding="utf-8"
                      ),
                      str(path),
                      "exec",
                  )
                  count += 1

          print(
              "Python source compilation: "
              f"PASS ({count} files)"
          )
          PY

      - name: Run current unit tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover \
            -s tests \
            -p 'test_*.py' \
            -v

      - name: Run current verifier
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/verify_current.py
